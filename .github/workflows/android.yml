name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sigil-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-build:
    name: Verify and build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.workers.max=2
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Verify zero-network manifest boundary
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -n 'android.permission.INTERNET' app/src/main/AndroidManifest.xml; then
            echo 'The INTERNET permission is forbidden in Sigil.' >&2
            exit 1
          fi
          if grep -R -n -E 'okhttp|retrofit|volley|HttpURLConnection|java\.net\.|android\.net::' app/src/main/java; then
            echo 'Network-capable source references are forbidden.' >&2
            exit 1
          fi
          if grep -R -n -E 'android\.permission\.(INTERNET|ACCESS_NETWORK_STATE)' app/src/main; then
            echo 'Network permissions are forbidden.' >&2
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK Platform 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: sigil-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sigil-build-reports
          path: |
            app/build/reports/
            **/build/reports/
          if-no-files-found: ignore
          retention-days: 7
