name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sigil-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-build:
    name: Verify and build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.workers.max=2
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Verify zero-network boundary
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -n 'android.permission.INTERNET' app/src/main/AndroidManifest.xml; then
            echo 'The INTERNET permission is forbidden in Sigil.' >&2
            exit 1
          fi
          if grep -R -n -E 'okhttp|retrofit|volley|HttpURLConnection|java\.net\.|android\.net::' app/src/main/java; then
            echo 'Network-capable source references are forbidden.' >&2
            exit 1
          fi
          if grep -R -n -E 'android\.permission\.(INTERNET|ACCESS_NETWORK_STATE)' app/src/main; then
            echo 'Network permissions are forbidden.' >&2
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install Android SDK Platform 35
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="$RUNNER_TEMP/android-sdk"
          mkdir -p "$SDK_ROOT/cmdline-tools" "$SDK_ROOT/platforms"
          curl -fsSL -o "$RUNNER_TEMP/cmdline-tools.zip" https://dl.google.com/android/repository/commandlinetools-linux-12266719_latest.zip
          unzip -q "$RUNNER_TEMP/cmdline-tools.zip" -d "$RUNNER_TEMP/cmdline-tools"
          rm -rf "$SDK_ROOT/cmdline-tools/latest"
          mv "$RUNNER_TEMP/cmdline-tools/cmdline-tools" "$SDK_ROOT/cmdline-tools/latest"
          printf 'y\n%.0s' {1..20} | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK_ROOT" --licenses >/dev/null
          "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK_ROOT" "platforms;android-35" "build-tools;35.0.0" "build-tools;34.0.0"
          test -s "$SDK_ROOT/platforms/android-35/android.jar"
          test -x "$SDK_ROOT/build-tools/35.0.0/aapt2"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Generate debug keystore and sign APK
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE="$RUNNER_TEMP/sigil-debug.p12"
          keytool -genkeypair \
            -keystore "$KEYSTORE" \
            -storepass android \
            -keypass android \
            -alias sigil-debug \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname 'CN=Sigil Debug, OU=Android, O=Sigil, L=Unknown, ST=Unknown, C=US'
          APK=app/build/outputs/apk/debug/app-debug.apk
          SIGNED="$RUNNER_TEMP/sigil-debug-signed.apk"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -p -f 4 "$APK" "$RUNNER_TEMP/sigil-debug-aligned.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks "$KEYSTORE" --ks-pass pass:android --key-pass pass:android \
            --ks-key-alias sigil-debug --out "$SIGNED" "$RUNNER_TEMP/sigil-debug-aligned.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$SIGNED"
          mkdir -p app/build/outputs/apk/debug
          cp "$SIGNED" "$APK"

      - name: Verify APK signature and contents
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | head -12
          python3 - <<'PY'
          from zipfile import ZipFile
          import sys
          with ZipFile('app/build/outputs/apk/debug/app-debug.apk') as z:
              names = z.namelist()
          if not any(n == 'classes.dex' or (n.startswith('classes') and n.endswith('.dex')) for n in names):
              raise SystemExit('APK has no DEX payload')
          print('DEX payload verified:', sum(n.endswith('.dex') for n in names), 'files')
          PY
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: sigil-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sigil-build-reports
          path: |
            app/build/reports/
            **/build/reports/
          if-no-files-found: ignore
          retention-days: 7
